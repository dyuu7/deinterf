[project]
name = "deinterf"
dynamic = ["version"]
description = "Aeromagnetic interference compensation based on the Tolles–Lawson (T-L) model. Modular IoC pipeline with a scikit-style API."
readme = { file = "README.md", content-type = "text/markdown" }

# Requirements
requires-python = ">=3.10"
dependencies = [
    "dataioc[numpy]>=0.1.0,<0.2",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "typing-extensions>=4.10.0; python_version < '3.11'",
]

# Author Info
authors = [{ name = "dyuu7" }]
license = "MIT"
license-files = ["LICENSE"]

# Project Classifiers
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
examples = [
    "dafmit-aeromag>=0.3.0,<0.4",
    "matplotlib>=3.8.3",
    "ppigrf>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/dyuu7/deinterf"
Repository = "https://github.com/dyuu7/deinterf"
Issues = "https://github.com/dyuu7/deinterf/issues"

# Build System
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-cov"]
lint = ["ruff", "ty"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Omit commit/date suffixes from development versions.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["deinterf"]
include = ["deinterf/py.typed"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
