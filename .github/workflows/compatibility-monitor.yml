name: Compatibility monitor

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Python ${{ matrix.python-version }} / ${{ matrix.resolution }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.10", resolution: lowest-direct}
          - {python-version: "3.10", resolution: highest}
          - {python-version: "3.14", resolution: highest}
          - {python-version: "3.x", resolution: highest}
    uses: ./.github/workflows/dependency-compatibility.yml
    with:
      python-version: ${{ matrix.python-version }}
      resolution: ${{ matrix.resolution }}
